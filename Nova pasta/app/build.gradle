plugins { id 'com.android.application' }

android {
    namespace 'com.peugeot.smartdrive'
    compileSdk 35

    defaultConfig {
        applicationId 'com.peugeot.smartdrive'
        minSdk 25
        targetSdk 28
        versionCode 1
        versionName '1.0.0'
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}
